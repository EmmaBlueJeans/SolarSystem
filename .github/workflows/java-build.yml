name: Java build and behavior checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile source and checks
        run: javac -d out src/*.java tests/*.java

      - name: Run collision behavior checks
        run: java -cp out CollisionBehaviorTest
